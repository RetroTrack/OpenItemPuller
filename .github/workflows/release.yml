name: Release

# When a tag like v0.2.0-beta.1 is pushed: builds, tests and attaches the jar to a GitHub release.
# Uploading to Modrinth is done by hand with that jar.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Tag must match mod_version
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version v$VERSION in gradle.properties"
            exit 1
          fi

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # the mod jar only: not the sources jar
          JARS=$(ls build/libs/*.jar | grep -v -e '-sources\.jar$' -e '-dev\.jar$')
          FLAGS=""
          case "$GITHUB_REF_NAME" in *-*) FLAGS="--prerelease" ;; esac   # e.g. -beta.1
          gh release create "$GITHUB_REF_NAME" $JARS --title "$GITHUB_REF_NAME" --generate-notes $FLAGS
