name: Build

# Tests run on every push (any branch) and on pull requests.
# The full build (jar) only runs on main, after the tests passed.
# Tag pushes are handled by release.yml.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --stacktrace

  build:
    needs: test
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # The tests already ran in the job above
      - name: Build
        run: ./gradlew build -x test --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: openitempuller-jars
          path: build/libs/*.jar
