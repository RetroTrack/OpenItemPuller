name: Build

# Tests run on every push (any branch) and on pull requests.
# The full build (jar) only runs on main, after the tests passed.
# Tag pushes are handled by release.yml.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Check Gradle wrapper jar
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::gradle/wrapper/gradle-wrapper.jar is not in the repository. Run './gradlew wrapper' locally, then 'git add -f gradle/wrapper/gradle-wrapper.jar' and commit it."
            exit 1
          fi

      # The wrapper script lost its executable bit in git (committed from Windows)
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --stacktrace

  build:
    needs: test
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Check Gradle wrapper jar
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::gradle/wrapper/gradle-wrapper.jar is not in the repository. Run './gradlew wrapper' locally, then 'git add -f gradle/wrapper/gradle-wrapper.jar' and commit it."
            exit 1
          fi

      # The wrapper script lost its executable bit in git (committed from Windows)
      - name: Make gradlew executable
        run: chmod +x gradlew

      # The tests already ran in the job above
      - name: Build
        run: ./gradlew build -x test --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: openitempuller-jars
          path: build/libs/*.jar
